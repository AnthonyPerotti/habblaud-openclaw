# Habblaud para OpenClaw no Docker / ZimaOS.
name: habblaud

services:
  habblaud:
    build: .
    image: habblaud:local
    restart: unless-stopped
    ports:
      - "${HABBLAUD_BIND:-0.0.0.0}:${HABBLAUD_PORT:-4747}:4747"
    volumes:
      # Caminho absoluto dos dados do OpenClaw no host ZimaOS montado em modo somente leitura
      - "${OPENCLAW_DATA_DIR:-/DATA/AppData/openclaw}:/openclaw:ro"
      - habblaud-data:/data
    environment:
      OPENCLAW_HOME: /openclaw
      OPENCLAW_GATEWAY_URL: ${OPENCLAW_GATEWAY_URL:-}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      HABBLAUD_ALLOWED_HOSTS: ${HABBLAUD_ALLOWED_HOSTS:-*}
      HABBLAUD_DEMO: ${HABBLAUD_DEMO:-}
      HABBLAUD_BIND: ${HABBLAUD_BIND:-0.0.0.0}
      HABBLAUD_TERMINAL: ${HABBLAUD_TERMINAL:-1}
      HABBLAUD_UPDATE_CHECK: 0
      HABBLAUD_LANG: ${HABBLAUD_LANG:-pt}
      HABBLAUD_WORLD: ${HABBLAUD_WORLD:-}
      HABBLAUD_WORLD_URL: ${HABBLAUD_WORLD_URL:-}
      HABBLAUD_WORLD_DEV: ${HABBLAUD_WORLD_DEV:-}
    # O host visto de dentro do container (servidor do Habblaud World local em teste: HABBLAUD_WORLD_URL=
    # http://host.docker.internal:<porta> com HABBLAUD_WORLD_DEV=1). No Docker Desktop o nome já existe; no Linux,
    # host-gateway o aponta para o host. Inofensivo sem o World.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Endurecimento: sistema de arquivos só leitura (exceto /data e /tmp), sem capabilities extras.
    read_only: true
    # /tmp em memória, com teto: sem `size` o Docker deixa usar metade da RAM do host.
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Processo init mínimo: repassa sinais e recolhe processos órfãos.
    init: true

volumes:
  habblaud-data:
